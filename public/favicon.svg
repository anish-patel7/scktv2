<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE081"/>
      <stop offset="40%" stop-color="#DFAC38"/>
      <stop offset="70%" stop-color="#C68E17"/>
      <stop offset="100%" stop-color="#8E6008"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Dark Rounded Hex/Circle for Favicon Visibility -->
  <rect width="100" height="100" rx="20" fill="#091624"/>

  <g filter="url(#goldGlow)">
    <!-- Outer Crescent 'C' -->
    <path d="M 52,14 C 28,14 12,30 12,52 C 12,74 28,90 52,90 C 40,84 25,72 25,52 C 25,32 40,20 52,14 Z" fill="url(#goldGrad)"/>

    <!-- Weave Grid Inside 'C' -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
      <!-- Vertical Lines -->
      <line x1="33" y1="42" x2="33" y2="62"/>
      <line x1="39" y1="42" x2="39" y2="62"/>
      <line x1="45" y1="42" x2="45" y2="62"/>
      <!-- Horizontal Lines -->
      <line x1="28" y1="47" x2="50" y2="47"/>
      <line x1="28" y1="52" x2="50" y2="52"/>
      <line x1="28" y1="57" x2="50" y2="57"/>
    </g>

    <!-- 'K' Main Vertical Stem -->
    <rect x="52" y="38" width="6" height="48" rx="2" fill="url(#goldGrad)"/>

    <!-- 'K' Upper Sweeping Arc -->
    <path d="M 54,54 C 65,42 78,32 94,36 C 82,42 70,52 58,62 Z" fill="url(#goldGrad)"/>

    <!-- 'K' Lower Leg -->
    <path d="M 56,58 L 84,86 L 75,86 L 52,63 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
