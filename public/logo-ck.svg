<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE081"/>
      <stop offset="35%" stop-color="#DFAC38"/>
      <stop offset="70%" stop-color="#C68E17"/>
      <stop offset="100%" stop-color="#8E6008"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Crescent 'C' -->
    <path d="M 52,10 C 26,10 8,28 8,52 C 8,76 26,94 52,94 C 38,87 22,74 22,52 C 22,30 38,17 52,10 Z" fill="url(#goldGradFull)"/>

    <!-- Weave Grid Inside 'C' -->
    <g stroke="url(#goldGradFull)" stroke-width="2.8" stroke-linecap="round">
      <!-- Vertical Lines -->
      <line x1="32" y1="40" x2="32" y2="64"/>
      <line x1="39" y1="40" x2="39" y2="64"/>
      <line x1="46" y1="40" x2="46" y2="64"/>
      <!-- Horizontal Lines -->
      <line x1="26" y1="46" x2="52" y2="46"/>
      <line x1="26" y1="52" x2="52" y2="52"/>
      <line x1="26" y1="58" x2="52" y2="58"/>
    </g>

    <!-- 'K' Main Vertical Stem -->
    <rect x="52" y="36" width="6.5" height="52" rx="2" fill="url(#goldGradFull)"/>

    <!-- 'K' Upper Sweeping Arc -->
    <path d="M 54,54 C 66,40 80,30 96,34 C 84,40 72,51 58,62 Z" fill="url(#goldGradFull)"/>

    <!-- 'K' Lower Leg -->
    <path d="M 56,58 L 86,88 L 76,88 L 52,64 Z" fill="url(#goldGradFull)"/>
  </g>
</svg>
